services:
  server:
    build: .
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [game]
    mem_limit: 1g
    pids_limit: 64
    cpus: 2
    restart: unless-stopped

  proxy:
    image: caddy:2.11.9-alpine
    depends_on: [server]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [game, web]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    depends_on: [server]
    command: tunnel --metrics 127.0.0.1:20241 --url http://server:8098
    networks: [game, web]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped

networks:
  game:
    internal: true
  web:

volumes:
  caddy_data:
  caddy_config:
