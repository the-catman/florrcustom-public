services:
  server:
    build: .
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MODE: ${MODE:-}
      DEV_KEYS: ${DEV_KEYS:-}
    ports:
      - "${GAME_PORT:-8098}:8098"
    mem_limit: 1g
    pids_limit: 64
    cpus: 2
    restart: unless-stopped
